name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: |
          make
          make check
      - name: Create source archive
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          git archive --format=tar.gz --prefix="cg-${version}/" -o "dist/cg-${version}.tar.gz" "${GITHUB_REF_NAME}"
          sha256sum "dist/cg-${version}.tar.gz" > "dist/cg-${version}.tar.gz.sha256"
      - name: Release notes
        run: cp "RELEASE_NOTES_${GITHUB_REF_NAME#v}.md" dist/notes.md
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: dist/notes.md
          files: |
            dist/cg-*.tar.gz
            dist/cg-*.tar.gz.sha256
